[project]
name = "jyz-worker-prueba"
version = "0.1.0"
description = "Prueba de Django existente en Python Workers; no publicación comercial"
requires-python = ">=3.13,<3.15"
dependencies = [
  "django==5.2.18",
  "pillow==12.2.0",
  "psycopg==3.3.5",
  "psycopg-binary==3.3.5",
  "httpx==0.28.1",
  "tzdata==2026.5",
]

[dependency-groups]
dev = ["workers-py==1.17.7", "workers-runtime-sdk==1.9.3", "uv==0.12.23", "psycopg-binary==3.3.5"]

[tool.uv]
package = false
